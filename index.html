<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque & Tiers - Minimal Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Constellations & Lectures</h1>
        <p>ARCHIVE STATIQUE DES ŒUVRES ET CLASSEMENTS</p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchView('tiers')">Vue par Tiers</button>
        <button class="nav-btn" onclick="switchView('all-books')">Tous les livres</button>
        <button class="nav-btn" onclick="switchView('authors')">Classement Auteurs</button>
        <button class="nav-btn" onclick="switchView('admin')">+ Ajouter</button>
    </nav>

    <div class="container">
        <!-- VUE PAR TIERS -->
        <div id="view-tiers" class="view-section active">
            <div id="tiers-container"></div>
        </div>

        <!-- VUE TOUS LES LIVRES -->
        <div id="view-all-books" class="view-section">
            <div class="section-header">
                <h2>Répertoire Global</h2>
                <div class="sort-controls">
                    <label>Trier par : </label>
                    <select id="global-sort-select" onchange="renderAllBooks()">
                        <option value="author">Auteur</option>
                        <option value="title">Titre</option>
                        <option value="year">Année</option>
                        <option value="tier">Tier</option>
                    </select>
                </div>
            </div>
            <div class="table-container">
                <table class="minimal-table">
                    <thead>
                        <tr>
                            <th>Auteur</th>
                            <th>Release / Titre</th>
                            <th>Année</th>
                            <th>Tags</th>
                        </tr>
                    </thead>
                    <tbody id="all-books-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- VUE CLASSEMENT AUTEURS -->
        <div id="view-authors" class="view-section">
            <div class="section-header">
                <h2>Ranking des Auteurs</h2>
                <div class="sort-controls">
                    <label>Trier par : </label>
                    <select id="author-sort-select" onchange="renderAuthorsRanking()">
                        <option value="score">Score moyen</option>
                        <option value="alpha">Alphabétique (A-Z)</option>
                    </select>
                </div>
            </div>
            <div id="ranking-container" class="ranking-list"></div>
        </div>

        <!-- VUE DETAIL AUTEUR -->
        <div id="view-author-detail" class="view-section">
            <button onclick="switchView('authors')" class="back-btn">← Retour au classement</button>
            <div id="author-detail-content"></div>
        </div>

        <!-- VUE DETAIL / MODIFICATION LIVRE -->
        <div id="view-book-detail" class="view-section">
            <button onclick="switchView('tiers')" class="back-btn">← Retour</button>
            <div id="book-detail-content" class="admin-box" style="margin-top: 20px;"></div>
        </div>

        <!-- VUE AJOUT -->
        <div id="view-admin" class="view-section">
            <div class="admin-box">
                <h2>Ajouter une lecture</h2>
                <form id="add-book-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label>Titre de l'œuvre</label>
                        <input type="text" id="book-title" required placeholder="ex: Hypérion">
                    </div>
                    <div class="form-group">
                        <label>Auteur</label>
                        <input type="text" id="book-author" required placeholder="ex: Dan Simmons">
                    </div>
                    <div class="form-group">
                        <label>Année de parution</label>
                        <input type="number" id="book-year" required placeholder="ex: 1989">
                    </div>
                    <div class="form-group">
                        <label>Tier (Définit la note de l'auteur)</label>
                        <select id="book-tier">
                            <option value="Tier S">Tier S (Note 10)</option>
                            <option value="Tier A">Tier A (Note 8)</option>
                            <option value="Tier B">Tier B (Note 6)</option>
                            <option value="Tier C">Tier C (Note 4)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tags (séparés par des virgules)</label>
                        <input type="text" id="book-tags" placeholder="ex: Classics, Fiction, 19th Century">
                    </div>
                    <div class="form-group">
                        <label>Commentaire personnel</label>
                        <textarea id="book-comment" rows="3" placeholder="Votre avis..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
